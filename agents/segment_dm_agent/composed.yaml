type: composite

# Bundle-level env requirements. The rollout driver merges these on
# top of ROLLOUT_ENV_KWARGS BEFORE building the env, so the env's
# action space is the UNION of every phase's needs:
#   command_secondaries=True  -> 45 segment-PTT DOFs (15 segs x P,T,T)
#   command_dm=True           -> ~1225 DM actuator DOFs
# Per-phase adapters slot each phase's native output into the
# corresponding contiguous block; everything else is zero on that step.
env_kwarg_overrides:
  command_secondaries: true
  command_dm: true
  # dm_atmos was trained with deltas (per-step add, NOT absolute
  # overwrite). Without this flag, every segment phase's zero-DM
  # block wipes the accumulated DM correction and the dm_atmos
  # phases get misinterpreted as full-stroke absolute commands.
  dm_incremental_control: true

phases:
- name: segment-phase-00
  checkpoint: checkpoints/phase_00.pt
  until: &id_seg {step: 16}
  adapter:
    type: slice
    target_slice: [0, 45]    # segment PTT block (15 segs x 3 DOF)
- name: dm-atmos-after-00
  checkpoint: checkpoints/dm_atmos_phase.pt
  until: &id_atm {step: 32}
  adapter:
    type: zernike_to_dm
    n_modes: 64              # matches the dm_atmos checkpoint head
    action_scale: 0.01       # matches training-time env_action_scale
    # dm_slice / env_action_dim auto-derived from the env (DM block
    # sits at the tail of the action vector).

- name: segment-phase-01
  checkpoint: checkpoints/phase_01.pt
  until: *id_seg
  adapter: {type: slice, target_slice: [0, 45]}
- name: dm-atmos-after-01
  checkpoint: checkpoints/dm_atmos_phase.pt
  until: *id_atm
  adapter: {type: zernike_to_dm, n_modes: 64, action_scale: 0.01}

- name: segment-phase-02
  checkpoint: checkpoints/phase_02.pt
  until: *id_seg
  adapter: {type: slice, target_slice: [0, 45]}
- name: dm-atmos-after-02
